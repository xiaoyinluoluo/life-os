name: Publish Life OS

on:
  push:
    branches: [main]
    paths:
      - "cloud/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/web/package-lock.json
      - name: Install and build
        working-directory: cloud/web
        env:
          VITE_SUPABASE_URL: ${{ vars.LIFE_OS_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.LIFE_OS_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cloud/web/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
